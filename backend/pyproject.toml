[project]
name = "ocio-portal-backend"
version = "0.1.0"
description = "OCIO Portal backend - FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0.30,<2.1",
  "greenlet>=3.0,<3.2",
  "alembic>=1.13,<2.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<0.7",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
